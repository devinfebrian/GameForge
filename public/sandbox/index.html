<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameForge Sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
    <!--
      No CSP meta tag here on purpose. The frame runs in an opaque origin, so a
      policy would have to name origins explicitly, and 'self' matches nothing
      there (blank frame in WebKit). The policy is sent as a real header from
      next.config.ts, which also makes frame-ancestors effective.
    -->
  </head>
  <body>
    <div id="game"></div>
    <!-- riffwave must load before sfxr: sfxr reads the RIFFWAVE global. -->
    <script src="/sandbox/vendor/jsfxr/riffwave.js"></script>
    <script src="/sandbox/vendor/jsfxr/sfxr.js"></script>
    <!-- Classic script: produces the global Phaser that the module below reads. -->
    <script src="/sandbox/vendor/phaser.min.js"></script>
    <script type="module" src="/sandbox/runner.js"></script>
  </body>
</html>
